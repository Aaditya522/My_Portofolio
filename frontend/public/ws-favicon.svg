<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ws-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#ws-grad)" filter="url(#shadow)" />

  <!-- Inner Gloss Border -->
  <rect x="48" y="48" width="416" height="416" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Monogram WS Text -->
  <text x="256" y="318" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="200" fill="#ffffff" text-anchor="middle" letter-spacing="-6">WS</text>
</svg>
